<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitar store — магазин одягу</title>
<style>
:root{--bg:#fff;--fg:#0a0a0a;--muted:#6b6b6b;--line:#e4e4e4;--card:#f6f6f6;--accent:#1d4ed8;--onaccent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#fff;--muted:#a0a0a0;--line:#262626;--card:#161616;--accent:#3b82f6}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#fff;--muted:#a0a0a0;--line:#262626;--card:#161616;--accent:#3b82f6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{position:relative;margin:0;background:var(--bg);color:var(--fg);font-family:Helvetica,Arial,sans-serif;line-height:1.5}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 24px;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.brand{font-weight:800;letter-spacing:.3em;font-size:20px}
.brand .store{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:lowercase;margin-left:8px;vertical-align:super}
nav{display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--fg);background:transparent;padding:8px 16px;cursor:pointer;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.btn,.chip{box-shadow:0 0 10px rgba(59,130,246,.4);transition:transform .2s ease,background-color .2s ease,color .2s ease,box-shadow .2s ease,opacity .2s ease}
.btn:hover,.chip:hover{transform:scale(1.06)}
.btn:active,.chip:active{transform:scale(.98)}
.pill{border-radius:999px;padding:12px 30px}
.btn:hover{background:var(--fg);color:var(--bg);box-shadow:0 0 18px rgba(59,130,246,.65)}
@media (prefers-reduced-motion:reduce){.btn,.chip{transition:none}.btn:hover,.chip:hover{transform:none}}
.btn.blue{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn.blue:hover{opacity:.88;background:var(--accent);color:var(--onaccent)}
.hero{padding:80px 24px;max-width:1100px;margin:0 auto;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(38px,8vw,84px);line-height:1;margin:0 0 20px;font-weight:900;letter-spacing:-.02em;max-width:12ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:46ch;color:var(--muted);font-size:18px;margin:0 0 28px}
main{max-width:1100px;margin:0 auto;padding:40px 24px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;align-items:center}
.chip{border:1px solid var(--line);background:transparent;padding:6px 14px;cursor:pointer;font-size:13px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}
.card{position:relative}
.ph{aspect-ratio:3/4;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain}
.ph svg{width:55%;color:#fff;opacity:.85}
.tag{position:absolute;top:10px;left:10px;background:var(--accent);color:var(--onaccent);font-size:11px;padding:2px 8px;letter-spacing:.08em;text-transform:uppercase}
.card h3{margin:12px 0 2px;font-size:15px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:700;color:var(--accent)}
.cat{color:var(--muted);font-size:13px}
.add{margin-top:10px;width:100%}
.adm{display:none;gap:6px;margin-top:8px}
body.edit .adm{display:flex}
body.edit [data-ed]{outline:2px dashed var(--accent);outline-offset:4px;cursor:text}
.adm .btn{flex:1;padding:6px}
.newbtn{display:none}
body.edit .newbtn{display:inline-block}
#editbar{display:none;background:var(--accent);color:var(--onaccent);padding:8px 24px;font-size:13px;gap:12px;align-items:center;flex-wrap:wrap}
body.edit #editbar{display:flex}
#editbar .btn{border-color:var(--onaccent);color:var(--onaccent);padding:4px 10px}
#editbar .btn:hover{background:var(--onaccent);color:var(--accent)}
footer{border-top:1px solid var(--line);padding:32px 24px;text-align:center;color:var(--muted);font-size:13px}
dialog{border:1px solid var(--fg);background:var(--bg);color:var(--fg);padding:24px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.08em}
dialog input,dialog select{width:100%;padding:8px;border:1px solid var(--line);background:var(--bg)}
.cartline{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
#toast.on{opacity:1}

<footer><span data-ed="footer">© Vitar · Доставка по всій Україні · hello@noir.example</span></footer>

<dialog id="pd">
<h3 id="pdt" style="margin:0">Товар</h3>
<label>Назва</label><input id="fn">

<label>Категорія</label><input id="fc" placeholder="Футболки, Худі, Штани…">
<label>Мітка (необов’язково)</label><input id="ft" placeholder="Новинка, −20%…">
<label>Фото</label><input id="fi" type="file" accept="image/*">
<div class="row" style="margin-top:20px"><button class="btn" id="pc">Скасувати</button><button class="btn blue" id="ps">Зберегти</button></div>
</dialog>

<dialog id="cd">
<h3 style="margin:0 0 8px">Кошик</h3>
<div id="cl"></div>
<div class="row" style="margin-top:16px"><strong id="ct"></strong></div>
<div class="row" style="margin-top:16px"><button class="btn" id="cc">Закрити</button><button class="btn blue" id="co">Оформити</button></div>
</dialog>
<div id="toast"></div>

<script>
var KEY="noir-shop-v1";
var TEE='<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M33 12 12 26l8 16 10-5v51h40V37l10 5 8-16-21-14c-3 7-9 10-17 10s-14-3-17-10z"/></svg>';
var DEF={brand:"Vitar",heroTitle:"Vitar store",heroText:"Мінімалістичний одяг на кожен день. Чисті лінії, якісні тканини, один яскравий синій акцент.",footer:"© Vitar · Доставка по всій Україні · hello@noir.example",
products:[
{id:1,name:"Футболка Basic",price:690,cat:"Футболки",tag:"",img:""},
{id:2,name:"Худі Oversize",price:1890,cat:"Худі",tag:"",img:""},
{id:3,name:"Штани Straight",price:1490,cat:"Штани",tag:"",img:""},
{id:4,name:"Сорочка Oxford",price:1290,cat:"Сорочки",tag:"",img:""},
{id:5,name:"Куртка Bomber",price:3290,cat:"Верхній одяг",tag:"",img:""},
{id:6,name:"Кепка Logo",price:490,cat:"Аксесуари",tag:"",img:""}]};
var S,cart=[],cat="Всі",editId=null,pendingImg=null;
function load(){try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):JSON.parse(JSON.stringify(DEF))}catch(e){S=JSON.parse(JSON.stringify(DEF))}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Не вдалося зберегти (мало місця для фото)")}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(i){return document.getElementById(i)}
function toast(t){var e=$("toast");e.textContent=t;e.className="on";setTimeout(function(){e.className=""},2200)}
function texts(){document.querySelectorAll("[data-ed]").forEach(function(el){var k=el.dataset.ed;if(S[k]!=null)el.textContent=S[k]})}
function render(){
 var cats=["Всі"];S.products.forEach(function(p){if(p.cat&&cats.indexOf(p.cat)<0)cats.push(p.cat)});
 if(cats.indexOf(cat)<0)cat="Всі";
 $("filters").innerHTML=cats.map(function(c){return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join("");
 var list=S.products.filter(function(p){return cat==="Всі"||p.cat===cat});
 $("grid").innerHTML=list.map(function(p){return '<div class="card"><div class="ph">'+(p.img?'<img src="'+esc(p.img)+'" alt="'+esc(p.name)+'">':TEE)+'</div>'+(p.tag?'<span class="tag">'+esc(p.tag)+'</span>':'')+'<h3>'+esc(p.name)+'</h3><div class="row"><span class="cat">'+esc(p.cat)+'</span></div><div class="adm"><button class="btn" data-e="'+p.id+'">Змінити</button><button class="btn" data-d="'+p.id+'">Видалити</button></div></div>'}).join("")||'<p class="cat">Товарів поки немає.</p>';
 $("cartbtn").textContent="Кошик ("+cart.length+")";
}
$("filters").onclick=function(e){var c=e.target.dataset.c;if(c){cat=c;render()}};
$("grid").onclick=function(e){var d=e.target.dataset,id;
 if(d.a){id=+d.a;cart.push(S.products.filter(function(p){return p.id===id})[0]);render();toast("Додано в кошик")}
 if(d.e)openP(+d.e);
 if(d.d&&confirm("Видалити товар?")){S.products=S.products.filter(function(p){return p.id!==+d.d});save();render()}};
document.querySelectorAll("[data-ed]").forEach(function(el){el.addEventListener("blur",function(){if(!document.body.classList.contains("edit"))return;S[el.dataset.ed]=el.textContent;save()})});
$("edtoggle").onclick=function(){var on=document.body.classList.toggle("edit");$("edtoggle").textContent=on?"Готово":"Редагувати";
 document.querySelectorAll("[data-ed]").forEach(function(el){el.contentEditable=on?"true":"false"})};
function openP(id){editId=id;pendingImg=null;var p=id?S.products.filter(function(x){return x.id===id})[0]:{name:"",price:"",cat:"",tag:""};
 $("pdt").textContent=id?"Редагувати товар":"Новий товар";$("fn").value=p.name;$("fc").value=p.cat;$("ft").value=p.tag||"";$("fi").value="";$("pd").showModal()}
$("newp").onclick=function(){openP(null)};
$("pc").onclick=function(){$("pd").close()};
$("fi").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=700,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);pendingImg=c.toDataURL("image/jpeg",.8)};im.src=r.result};r.readAsDataURL(f)};
$("ps").onclick=function(){var n=$("fn").value.trim();if(!n){toast("Вкажіть назву");return}
 var o={name:n,cat:$("fc").value.trim()||"Інше",tag:$("ft").value.trim()};
 if(editId){var p=S.products.filter(function(x){return x.id===editId})[0];Object.assign(p,o);if(pendingImg)p.img=pendingImg}
 else{o.id=Date.now();o.img=pendingImg||"";S.products.push(o)}
 save();render();$("pd").close()};
$("cartbtn").onclick=function(){drawCart();$("cd").showModal()};
$("cc").onclick=function(){$("cd").close()};
function drawCart(){var t=0;$("cl").innerHTML=cart.map(function(p,i){return '<div class="cartline"><span>'+esc(p.name)+'</span><span><button class="chip" data-r="'+i+'">×</button></span></div>'}).join("")||'<p class="cat">Кошик порожній.</p>';
 $("ct").textContent="Товарів: "+cart.length}
$("cl").onclick=function(e){if(e.target.dataset.r!=null){cart.splice(+e.target.dataset.r,1);drawCart();render()}};
$("co").onclick=function(){if(!cart.length)return;cart=[];$("cd").close();render();toast("Дякуємо! Це демо-оформлення, оплата не підключена.")};
$("exp").onclick=function(){var s=JSON.stringify(S);if(navigator.clipboard){navigator.clipboard.writeText(s).then(function(){toast("Дані скопійовано")},function(){prompt("Скопіюйте:",s)})}else prompt("Скопіюйте:",s)};
$("imp").onclick=function(){var s=prompt("Вставте раніше експортовані дані:");if(!s)return;try{S=JSON.parse(s);save();texts();render()}catch(e){toast("Невірний формат")}};
$("rst").onclick=function(){if(confirm("Скинути всі зміни?")){S=JSON.parse(JSON.stringify(DEF));save();texts();render()}};
load();texts();render();
</script>
</body>
</html>
